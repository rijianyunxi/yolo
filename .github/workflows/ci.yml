name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端测试 (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: 后端测试 (pytest)
        run: python -m pytest -q
      - name: 编译检查 (compileall)
        run: python -m compileall -q webui

  frontend:
    name: 前端检查 (TypeScript / Vitest / 构建)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webui/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: webui/frontend/package-lock.json
      - name: 安装依赖
        run: npm ci
      - name: 类型检查 (tsc)
        run: npx tsc --noEmit
      - name: 单元 / 组件测试 (vitest)
        run: npm test -- --run
      - name: 生产构建 (vite build)
        run: npm run build

  e2e:
    name: E2E 验收 (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webui/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: webui/frontend/package-lock.json
      - name: 安装依赖
        run: npm ci
      - name: 安装 Playwright 浏览器（固定版本，来自 package-lock）
        run: npx playwright install --with-deps chromium
      - name: 运行 Playwright 测试
        run: npm run e2e
      - name: 失败时上传 trace / screenshot 报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            webui/frontend/test-results/
            webui/frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 7